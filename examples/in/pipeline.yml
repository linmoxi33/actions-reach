name: release pipeline
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - id: check
        run: echo "should_release=true" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.shold_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: make build

  docs:
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - run: make docs

  publish:
    needs: [check, build]
    if: >-
      always() &&
      needs.check.outputs.should_release == 'true' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - run: make publish
